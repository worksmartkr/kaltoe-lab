name: daily-carousel
on:
  # 매일 19:17 KST 자동 실행 (끄려면 아래 두 줄 주석 처리)
  schedule:
    - cron: "17 10 * * *"
  workflow_dispatch:
    inputs:
      publish:
        description: "인스타에 게시까지 할지"
        type: boolean
        default: false
permissions:
  contents: write
  pages: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk fonts-noto-color-emoji ffmpeg
      - name: generate + render (+ publish)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          IG_WORK_USER_ID: ${{ secrets.IG_WORK_USER_ID }}
          IG_WORK_TOKEN: ${{ secrets.IG_WORK_TOKEN }}
          IMAGE_REPO_DIR: ${{ github.workspace }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          GIT_AUTHOR_NAME: carousel-bot
          GIT_AUTHOR_EMAIL: bot@users.noreply.github.com
          GIT_COMMITTER_NAME: carousel-bot
          GIT_COMMITTER_EMAIL: bot@users.noreply.github.com
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.publish }}" = "true" ]; then
            python run_daily.py --accounts work --publish
          else
            python run_daily.py --accounts work
          fi
      - name: save results (content, topics, posted log)
        run: |
          git config user.name carousel-bot
          git config user.email bot@users.noreply.github.com
          git add -A
          git commit -m "daily carousel $(date +%F)" || echo "nothing to commit"
          git push
      - uses: actions/upload-artifact@v4
        with: { name: carousel, path: output/ }

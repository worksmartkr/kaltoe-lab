name: preview
on:
  workflow_dispatch:
    inputs:
      file:
        description: "렌더할 문안 JSON 경로 (예: content/work/001_excel_shortcuts.json)"
        required: true
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk fonts-noto-color-emoji ffmpeg
      - run: |
          python render.py "${{ inputs.file }}"
          python branding/profile.py
          python reel.py output/$(basename $(dirname "${{ inputs.file }}"))/$(basename "${{ inputs.file }}" .json)
          name=$(basename "${{ inputs.file }}" .json)
          key=$(basename $(dirname "${{ inputs.file }}"))
          mkdir -p preview/$name
          cp output/$key/$name/* preview/$name/
      - run: |
          git config user.name carousel-bot
          git config user.email bot@users.noreply.github.com
          git add preview
          git commit -m "preview ${{ inputs.file }}" || echo "nothing"
          git push

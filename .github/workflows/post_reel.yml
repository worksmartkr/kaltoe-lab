name: post-reel
on:
  workflow_dispatch:
    inputs:
      file:
        description: "릴스로 올릴 문안 JSON (예: content/work/001_excel_shortcuts.json)"
        required: true
permissions:
  contents: write
  pages: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk fonts-noto-color-emoji ffmpeg
      - env:
          IG_WORK_USER_ID: ${{ secrets.IG_WORK_USER_ID }}
          IG_WORK_TOKEN: ${{ secrets.IG_WORK_TOKEN }}
          IMAGE_REPO_DIR: ${{ github.workspace }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          GIT_AUTHOR_NAME: carousel-bot
          GIT_AUTHOR_EMAIL: bot@users.noreply.github.com
          GIT_COMMITTER_NAME: carousel-bot
          GIT_COMMITTER_EMAIL: bot@users.noreply.github.com
        run: |
          python render.py "${{ inputs.file }}"
          out=output/$(basename $(dirname "${{ inputs.file }}"))/$(basename "${{ inputs.file }}" .json)
          python reel.py $out
          python publish.py $out --reel-only
      - run: |
          git config user.name carousel-bot
          git config user.email bot@users.noreply.github.com
          git add -A
          git commit -m "reel ${{ inputs.file }}" || echo "nothing"
          git push

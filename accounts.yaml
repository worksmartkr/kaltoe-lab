# 계정별 설정. handle은 실제 계정 만들고 바꾸세요.
# ig_user_id / token은 .env 에서 읽음 (IG_<KEY>_USER_ID, IG_<KEY>_TOKEN)

accounts:
  work:
    handle: "@worksmart.kr"
    name: "칼퇴연구소"
    niche: "직장인 업무 자동화 — 엑셀, 파이썬, 단축키, AI 툴 활용 팁"
    audience: "엑셀·문서 작업이 많은 20~30대 직장인"
    tone: "짧고 실용적, 바로 따라 할 수 있는 단계 위주"
    cta: "저장해두고 내일 출근해서 써보세요"
    brand: "KALTOE LAB"
    theme: { layout: "magazine", bg: "#1E1033", card: "#2E1A4D", text: "#FAF5FF", sub: "#C4B5FD", accent: "#A78BFA" }

  cad:
    handle: "@cad.daily"
    name: "CAD 데일리"
    niche: "기계설계 CAD 실무 팁 — 모델링 습관, 구속, 매개변수 설계, 도면"
    audience: "기계공학 전공생, 주니어 설계 엔지니어"
    tone: "실무자가 후배한테 알려주는 느낌, 정확한 용어"
    cta: "설계 실무 팁 더 보려면 팔로우"
    theme: { bg: "#F1F5F9", card: "#FFFFFF", text: "#0F172A", sub: "#475569", accent: "#2563EB" }

  guitar:
    handle: "@fret.note"
    name: "프렛노트"
    niche: "기타 독학 — 연습 루틴, 코드, 스케일, 리듬"
    audience: "기타 초보~중급 독학러"
    tone: "다정하고 동기부여, 오늘 바로 10분 연습할 수 있게"
    cta: "저장하고 오늘 10분만 연습해봐요"
    theme: { bg: "#1C1917", card: "#292524", text: "#FAFAF9", sub: "#A8A29E", accent: "#F59E0B" }

  meat:
    handle: "@gogi.lab"
    name: "고기연구소"
    niche: "고기 굽기·부위 상식 — 고깃집 알바생이 알려주는 진짜 팁"
    audience: "고기 좋아하는 20~30대, 캠핑·홈파티족"
    tone: "현장 경험담 느낌, 유쾌하지만 정보는 정확하게"
    cta: "다음 고기 먹기 전에 저장!"
    theme: { bg: "#FFF7ED", card: "#FFFFFF", text: "#431407", sub: "#9A3412", accent: "#EA580C" }
